name: Gerar APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Aplicar atualização completa
        run: |
          unzip -o motorista-pro-atualizacao-99-login-v8.zip -d .
          sed -i 's/version "8.7.3"/version "8.11.1"/' android/settings.gradle.kts
          sed -i 's/version "2.1.0"/version "2.2.20"/' android/settings.gradle.kts
          sed -i 's/event.source/event?.source/' android/app/src/main/kotlin/com/motoristapro/app/RideAccessibilityService.kt
          sed -i 's/System.currentTimeMillis() + 20000/Long.MAX_VALUE/' android/app/src/main/kotlin/com/motoristapro/app/RideAccessibilityService.kt
          sed -i 's/postDelayed(this, 1100)/postDelayed(this, 1800)/' android/app/src/main/kotlin/com/motoristapro/app/RideAccessibilityService.kt

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Completar estrutura Android
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          flutter create . --platforms=android --project-name motorista_pro --org com.motoristapro
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Instalar dependências
        run: flutter pub get

      - name: Executar testes
        run: flutter test

      - name: Gerar APK
        run: flutter build apk --release

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: motorista-pro-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

name: Gerar APK Androidon:  push:    branches: [main]  workflow_dispatch:permissions:  contents: readjobs:  build:    runs-on: ubuntu-latest    steps:      - name: Baixar código        uses: actions/checkout@v4      - name: Aplicar versão completa mais recente        run: unzip -o motorista-pro-atualizacao-corridas-v23.zip -d .      - name: Configurar Java        uses: actions/setup-java@v4        with:          distribution: temurin          java-version: "17"      - name: Configurar Flutter        uses: subosito/flutter-action@v2        with:          channel: stable          cache: true      - name: Completar estrutura Android        run: |          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml          flutter create . --platforms=android --project-name motorista_pro --org com.motoristapro
